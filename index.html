<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMR PHONES AR</title>
<meta name="description" content="دليل مواصفات الهواتف بالعربية: المزايا والعيوب لكل هاتف">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f172a;--card:#1e293b;--line:#334155;--text:#f1f5f9;--muted:#94a3b8;--accent:#38bdf8;--btn:#0369a1;--pro:#4ade80;--con:#f87171}
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.hdr{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{color:var(--accent);font-weight:700;font-size:1.15rem;white-space:nowrap;text-decoration:none}
.hdr input{flex:1;max-width:360px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
main{max-width:1000px;margin:0 auto;padding:16px}
h2{margin:8px 0 16px;border-inline-start:4px solid var(--accent);padding-inline-start:10px;font-size:1.25rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center;color:inherit;text-decoration:none;display:block}
.card:hover,.card:focus-visible{border-color:var(--accent);outline:none}
.card .ic{font-size:1.8rem}
.card .nm{font-weight:600;margin:4px 0}
.card .sub{color:var(--muted);font-size:.85rem}
.tag{display:inline-block;margin-top:6px;padding:2px 10px;border-radius:99px;background:var(--btn);font-size:.78rem}
.tag.mid{background:#7c3aed}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.btn{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 14px;font:inherit;cursor:pointer;text-decoration:none}
.btn:hover,.btn:focus-visible{border-color:var(--accent);outline:none}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel h3{margin:0 0 6px;color:var(--accent);font-size:1.4rem}
.meta{color:var(--muted);font-size:.9rem;margin-bottom:12px}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;background:var(--bg);border-radius:10px;padding:14px;margin:14px 0}
.specs small{display:block;color:var(--muted)}
.specs b{font-weight:600}
.pc{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.pc>div{border-radius:10px;padding:14px;border:1px solid}
.pc h4{margin:0 0 6px}
.pc ul{margin:0;padding-inline-start:20px}
.pros{border-color:#166534;background:#14312a}.pros h4{color:var(--pro)}
.cons{border-color:#991b1b;background:#3a2530}.cons h4{color:var(--con)}
.empty{color:var(--muted);padding:24px;text-align:center}
.ltr{unicode-bidi:isolate;direction:ltr;display:inline-block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header class="hdr">
  <a class="logo" href="#">📱 Mobiles Guide</a>
  <input type="search" id="q" placeholder="ابحث عن هاتف أو شركة..." aria-label="بحث">
</header>
<main id="app"></main>

<script>
/* =====================  البيانات  =====================
   لإضافة هاتف: انسخ كتلة هاتف واحدة في PHONES وعدّل عليها.
   company = رقم الشركة (id) من COMPANIES.
   released = تاريخ الإصدار بصيغة YYYY-MM (يُستعمل للترتيب: الأحدث أولًا).
   price = اختياري (مثال: "1299$"). */
const COMPANIES = [
  {id:'samsung',  name:'سامسونج (Samsung)',          icon:'📱'},
  {id:'apple',    name:'آبل (Apple)',                 icon:'🍏'},
  {id:'xiaomi',   name:'شاومي / ريدمي / بوكو',        icon:'⚡'},
  {id:'huawei',   name:'هواوي (Huawei)',              icon:'🔴'},
  {id:'oppo',     name:'أوبو (Oppo)',                 icon:'🟢'},
  {id:'realme',   name:'ريلمي (Realme)',              icon:'🟡'},
  {id:'oneplus',  name:'ون بلس (OnePlus)',            icon:'🔺'},
  {id:'pixel',    name:'Google Pixel',                icon:'📱'},
  {id:'honor',    name:'هونر (Honor)',                icon:'🔵'},
  {id:'vivo',     name:'فيفو (Vivo)',                 icon:'🟣'},
  {id:'infinix',  name:'إنفينكس (Infinix)',           icon:'🟠'},
  {id:'tecno',    name:'تكنو (Tecno)',                icon:'🟤'},
  {id:'motorola', name:'موتورولا (Motorola)',         icon:'Ⓜ️'},
  {id:'sony',     name:'سوني (Sony)',                 icon:'⚫'},
  {id:'nokia',    name:'نوكيا / HMD (Nokia)',         icon:'🔷'},
  {id:'nothing',  name:'ناثينغ (Nothing)',            icon:'⚪'}
];

const PHONES = [
  {
    id:'galaxy-s26-ultra', company:'samsung', name:'Galaxy S26 Ultra',
    tier:'flagship', released:'2026-02', price:'',
    specs:{
      'الشاشة':'6.9 بوصة Dynamic AMOLED 2X، 120Hz، سطوع 2600 نت',
      'المعالج':'Snapdragon 8 Elite Gen 5 for Galaxy',
      'الكاميرات':'خلفية رباعية: 200 + 50 + 50 + 10 ميغابكسل',
      'البطارية والشحن':'5000 mAh، شحن سلكي 60 واط',
      'الذاكرة والتخزين':'12/16 جيجا رام مع 256/512GB/1TB'
    },
    pros:['شاشة خصوصية مدمجة','شحن أسرع (60 واط)','أخف وأنحف من S25 Ultra','قلم S-Pen'],
    cons:['تحسينات الكاميرا محدودة','حجم البطارية لم يتغير','لا يدعم الشحن المغناطيسي Qi2']
  }
  /* ,{ id:'galaxy-s25-ultra', company:'samsung', name:'Galaxy S25 Ultra', tier:'flagship', released:'2025-02', price:'', specs:{...}, pros:[...], cons:[...] } */
];

/* =====================  المنطق  ===================== */
const $ = s => document.querySelector(s);
const app = $('#app'), q = $('#q');
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tierTag = t => t==='flagship' ? '<span class="tag">فئة الهواتف الرائدة</span>' : '<span class="tag mid">الفئة المتوسطة العالية</span>';
const byNewest = (a,b) => (b.released||'').localeCompare(a.released||'');
const phonesOf = id => PHONES.filter(p=>p.company===id).sort(byNewest);
const nm = n => `<bdi class="ltr">${esc(n)}</bdi>`; /* يحل مشكلة علامة + وترتيب الأسماء */

function phoneCard(p){
  return `<a class="card" href="#${p.company}/${p.id}">
    <div class="nm">${nm(p.name)}</div>${tierTag(p.tier)}
    <div class="sub">${p.released||''}</div></a>`;
}

function home(){
  app.innerHTML = '<h2>اختر الشركة المصنعة</h2><div class="grid">' + COMPANIES.map(c=>{
    const n = phonesOf(c.id).length;
    return `<a class="card" href="#${c.id}"><div class="ic">${c.icon}</div>
      <div class="nm">${esc(c.name)}</div>
      <div class="sub">${n ? `يحتوي على ${n} هواتف متاحة` : 'قريبًا'}</div></a>`;
  }).join('') + '</div>';
}

function company(id){
  const c = COMPANIES.find(x=>x.id===id); if(!c) return home();
  const list = phonesOf(id);
  app.innerHTML = `<div class="bar"><a class="btn" href="#">⬅ العودة للشركات</a></div>
    <h2>هواتف ${esc(c.name)}</h2>` +
    (list.length ? `<div class="grid">${list.map(phoneCard).join('')}</div>` : '<p class="empty">لا توجد هواتف مضافة لهذه الشركة بعد.</p>');
}

function phone(cid,pid){
  const p = PHONES.find(x=>x.id===pid && x.company===cid); if(!p) return company(cid);
  const specs = Object.entries(p.specs).map(([k,v])=>`<div><small>${esc(k)}</small><b dir="auto">${esc(v)}</b></div>`).join('');
  if(p.price) {} 
  app.innerHTML = `<div class="bar">
      <a class="btn" href="#${cid}">⬅ العودة للقائمة</a>
      <button class="btn" id="share">🔗 نسخ رابط الهاتف</button></div>
    <div class="panel"><h3>${nm(p.name)}</h3>${tierTag(p.tier)}
      <div class="meta">${p.released?`تاريخ الإصدار: ${esc(p.released)}`:''}${p.price?` · السعر: ${esc(p.price)}`:''}</div>
      <div class="specs">${specs}</div>
      <div class="pc">
        <div class="pros"><h4>✅ المزايا والإيجابيات</h4><ul>${p.pros.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
        <div class="cons"><h4>❌ العيوب والسلبيات</h4><ul>${p.cons.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
      </div></div>`;
  $('#share').onclick = async e => {
    const url = location.origin + location.pathname + '#' + cid + '/' + pid;
    try { await navigator.clipboard.writeText(url); e.target.textContent = 'تم نسخ الرابط'; }
    catch { prompt('انسخ الرابط:', url); }
  };
  document.title = p.name + ' | AMR PHONES AR';
}

function search(t){
  t = t.trim().toLowerCase(); if(!t) return route();
  const cs = COMPANIES.filter(c=>c.name.toLowerCase().includes(t));
  const ps = PHONES.filter(p=>p.name.toLowerCase().includes(t)).sort(byNewest);
  app.innerHTML = '<h2>نتائج البحث</h2>' +
    (cs.length||ps.length
      ? `<div class="grid">${cs.map(c=>`<a class="card" href="#${c.id}"><div class="ic">${c.icon}</div><div class="nm">${esc(c.name)}</div></a>`).join('')}${ps.map(phoneCard).join('')}</div>`
      : '<p class="empty">ما لقينا نتائج. جرّب اسمًا آخر.</p>');
}

function route(){
  const [c,p] = decodeURIComponent(location.hash.slice(1)).split('/');
  document.title = 'AMR PHONES AR';
  if(c && p) phone(c,p); else if(c) company(c); else home();
  window.scrollTo(0,0);
}

addEventListener('hashchange', ()=>{ q.value=''; route(); });
q.addEventListener('input', ()=>search(q.value));
route();
</script>
</body>
</html>
